site:
  base_url: "https://ton-site.com/api"
  token: "env:SITE_TOKEN"
  endpoints:
    list: "/rentals?status=pending"
    assign: "/rentals/{id}/assign"
    status: "/rentals/{id}/status"
  poll_interval: 60

attribution:
  strategy: "round_robin"
  rules:
    crevaison: ["m1_Malek", "m2_Yacine"]
    frein: ["m1_Malek", "m3_Sara"]
    transmission: ["m2_Yacine", "m3_Sara"]
    electrique: ["m3_Sara"]
    autre: ["m1_Malek", "m2_Yacine", "m3_Sara"]

whatsapp:
  provider: "twilio"
  account_sid: "env:TWILIO_SID"
  auth_token: "env:TWILIO_TOKEN"
  from: "whatsapp:+14155238886"
  templates:
    staff: "🚲 Nouvelle loc #{id} — {type} x{quantite} du {date_debut} au {date_fin} — Client: {client_tel} — {lieu}"
    client: "✅ Votre demande vélo #{id} ({type} x{quantite}) est confirmée. Du {date_debut} au {date_fin}. Suivi WhatsApp activé. — {lieu}"
    update: "🔄 Location #{id} : {status}"

llm:
  enabled: true
  fallback: "heuristic"

logging:
  file: "logs/repair-agent.log"
  site_sync: true
